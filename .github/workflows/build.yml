name: Build MobileLineLogger v1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q MobileLineLogger_v1.zip -d build-project
          test -f build-project/MobileLineLogger_v1/settings.gradle.kts

      - name: Build debug APK
