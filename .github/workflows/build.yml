name: Build MobileLineLogger v2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q MobileLineLogger_v2.zip -d build-project

      - name: Build APK
        run: |
          cd build-project/MobileLineLogger_v2
          gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MobileLineLogger-v2-debug
          path: build-project/MobileLineLogger_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
