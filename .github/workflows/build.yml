name: Build MobileLineLogger v1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract
        run: |
          mkdir -p build-project
          unzip -q MobileLineLogger_v1.zip -d build-project
          find build-project -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          cd build-project/MobileLineLogger_v1
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileLineLogger-v1-debug
          path: build-project/MobileLineLogger_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
